<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>

    <!-- Gradients & Shadows -->
    <linearGradient id="plane-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="plane-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="plane-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="sphere-grad" x1="30%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.04" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
  </defs>

  <style>
    .bg-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 12; }
    .plane-main { fill: url(#plane-grad-blue); stroke: #0284c7; stroke-width: 1.8; stroke-linejoin: round; }
    .plane-sec { fill: url(#plane-grad-green); stroke: #16a34a; stroke-width: 1.8; stroke-linejoin: round; }
    .plane-ter { fill: url(#plane-grad-purple); stroke: #7c3aed; stroke-width: 1.8; stroke-linejoin: round; }
    .line-solid { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; stroke-linecap: round; }
    .vec-red { stroke: #dc2626; stroke-width: 2.2; stroke-linecap: round; }
    .vec-blue { stroke: #0284c7; stroke-width: 2.2; stroke-linecap: round; }
    .vec-green { stroke: #16a34a; stroke-width: 2.2; stroke-linecap: round; }
    .vec-amber { stroke: #d97706; stroke-width: 2.2; stroke-linecap: round; }
    .vec-purple { stroke: #7c3aed; stroke-width: 2.2; stroke-linecap: round; }
    .pt-dark { fill: #1e293b; }
    .pt-red { fill: #dc2626; }
    .pt-blue { fill: #0284c7; }
    .txt-sym { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 15px; font-weight: bold; font-style: italic; fill: #0f172a; }
    .txt-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
    .txt-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 800; fill: #0369a1; }
    .txt-note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
    .right-angle { fill: none; stroke: #dc2626; stroke-width: 1.5; }
    .angle-arc { fill: rgba(220, 38, 38, 0.15); stroke: #dc2626; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .bg-box { fill: #0f172a; stroke: #334155; }
      .line-solid { stroke: #f1f5f9; }
      .line-dash { stroke: #94a3b8; }
      .txt-sym { fill: #f8fafc; }
      .txt-lbl { fill: #cbd5e1; }
      .txt-note { fill: #cbd5e1; }
      .txt-title { fill: #38bdf8; }
      .pt-dark { fill: #f8fafc; }
    }
  </style>

  <!-- Background card frame -->
  <rect x="2" y="2" width="496" height="316" class="bg-box" />

  <line x1="170" y1="210" x2="170" y2="40" class="line-solid" marker-end="url(#arr-dark)" />
  <text x="178" y="48" class="txt-sym">z</text>
  <line x1="170" y1="210" x2="430" y2="210" class="line-solid" marker-end="url(#arr-dark)" />
  <text x="435" y="215" class="txt-sym">y</text>
  <line x1="170" y1="210" x2="70" y2="270" class="line-solid" marker-end="url(#arr-dark)" />
  <text x="60" y="280" class="txt-sym">x</text>
  <circle cx="170" cy="210" r="4" class="pt-dark" />
  <text x="155" y="222" class="txt-sym">O</text>
  <polygon points="120,240 330,210 170,85" fill="rgba(14, 165, 233, 0.28)" stroke="#0284c7" stroke-width="2.2" stroke-linejoin="round" />
  <line x1="170" y1="210" x2="120" y2="240" class="line-dash" />
  <line x1="170" y1="210" x2="330" y2="210" class="line-dash" />
  <line x1="170" y1="210" x2="170" y2="85" class="line-dash" />
  <circle cx="120" cy="240" r="4.5" class="pt-red" />
  <text x="110" y="258" class="txt-sym" fill="#dc2626">A(a;0;0)</text>
  <circle cx="330" cy="210" r="4.5" class="pt-red" />
  <text x="335" y="228" class="txt-sym" fill="#dc2626">B(0;b;0)</text>
  <circle cx="170" cy="85" r="4.5" class="pt-red" />
  <text x="180" y="90" class="txt-sym" fill="#dc2626">C(0;0;c)</text>

  <!-- Note Box -->
  <g transform="translate(15, 260)">
    <rect x="0" y="0" width="470" height="48" rx="8" fill="rgba(2, 132, 199, 0.07)" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3,3" />
    <text x="12" y="20" class="txt-title">Phương trình mặt phẳng theo đoạn chắn:</text>
    <text x="12" y="38" class="txt-note">x/a + y/b + z/c = 1 với a, b, c ≠ 0 là tọa độ giao điểm trên Ox, Oy, Oz.</text>
  </g>
</svg>